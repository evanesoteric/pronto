{# templates/_sidebar.html #}
<aside class="panel-sidebar">
  <div class="brand">🍺 Pronto</div>

  <nav>
    <a href="{% url 'core:dashboard' %}"
       class="{% if request.resolver_match.view_name == 'core:dashboard' %}active{% endif %}">
      📊 Dashboard
    </a>

    <div class="nav-section">Operations</div>

    <a href="{% url 'production:batches_list' %}"
       class="{% if 'production:batch' in request.resolver_match.view_name %}active{% endif %}">
      🔬 Batches
    </a>
    <a href="{% url 'production:tanks_list' %}"
       class="{% if 'production:tank' in request.resolver_match.view_name %}active{% endif %}">
      🛢️ Tanks
    </a>
    <a href="{% url 'production:recipes_list' %}"
       class="{% if 'production:recipe' in request.resolver_match.view_name %}active{% endif %}">
      📖 Recipes
    </a>

    <a href="{% url 'inventory:lots_list' %}"
       class="{% if 'inventory:lot' in request.resolver_match.view_name %}active{% endif %}">
      📦 Inventory
    </a>
    <a href="{% url 'inventory:receive_form' %}"
       class="{% if request.resolver_match.view_name == 'inventory:receive_form' %}active{% endif %}">
      ⬇️ Receive Shipment
    </a>

    <div class="nav-section">Sales</div>

    <a href="{% url 'sales:orders_list' %}"
       class="{% if 'sales:order' in request.resolver_match.view_name %}active{% endif %}">
      🛒 Orders
    </a>
    <a href="{% url 'sales:customers_list' %}"
       class="{% if 'sales:customer' in request.resolver_match.view_name %}active{% endif %}">
      👥 Customers
    </a>

    <div class="nav-section">Tools</div>

    <a href="#" class="disabled" style="opacity: 0.4; pointer-events: none;">
      🔍 Scan Anything <span class="badge bg-secondary ms-1">soon</span>
    </a>
    <a href="#" class="disabled" style="opacity: 0.4; pointer-events: none;">
      🏷️ Print Queue <span class="badge bg-secondary ms-1">soon</span>
    </a>

    {% if request.user.role == 'admin' or request.user.is_superuser %}
    <div class="nav-section">Admin</div>
    <a href="/admin/">⚙️ Django Admin</a>
    {% endif %}
  </nav>
</aside>
