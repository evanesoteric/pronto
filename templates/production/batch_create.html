{% extends "base.html" %}
{% block title %}New Batch — Pronto{% endblock %}

{% block breadcrumbs %}
<a href="{% url 'production:batches_list' %}" class="text-decoration-none text-muted">Batches</a>
<span class="text-muted mx-1">/</span>
<strong>New</strong>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h4 class="mb-3">New Batch at {{ facility.name }}</h4>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Batch number</label>
            <input type="text" name="batch_number" class="form-control font-monospace"
                   value="{{ form_data.batch_number|default:'' }}" required autofocus>
          </div>

          <div class="mb-3">
            <label class="form-label">Recipe</label>
            <select name="recipe" class="form-select" required>
              <option value="">— select recipe —</option>
              {% for r in recipes %}
              <option value="{{ r.pk }}"
                {% if form_data.recipe == r.pk|stringformat:"s" %}selected{% endif %}>
                {{ r.name }} v{{ r.version }}{% if r.style %} — {{ r.style }}{% endif %}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Planned volume (L)</label>
            <input type="number" step="0.01" min="0.01" name="planned_volume_liters"
                   class="form-control"
                   value="{{ form_data.planned_volume_liters|default:'' }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control" rows="2">{{ form_data.notes|default:'' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Create Batch</button>
            <a href="{% url 'production:batches_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
